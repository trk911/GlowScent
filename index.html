
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>GlowScent | Final</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#0a0a0a;}
#scene{position:relative;height:1000vh;}
.viewport{position:sticky;top:0;height:100vh;overflow:hidden;}
/* الخلفية - ديناميكية مع عرض الشاشة بدون زووم */
.bg{position:absolute;top:0;left:0;width:100%;height:auto;min-height:3300px;background:url('background.PNG') top center/cover no-repeat;background-color:#0a0a0a;z-index:0;}
.frame{position:absolute;width:150%;height:150%;top:-25%;left:-25%;display:none;z-index:1;}
.frame.active{display:flex;align-items:center;justify-content:center;}
.frame img{width:100%;height:100%;object-fit:contain;}
.text-block{position:absolute;width:80%;left:10%;padding:20px;background:rgba(0,0,0,0.6);color:white;text-align:center;border-radius:10px;z-index:2;}
#b1{top:100vh;}#b2{top:200vh;}#b3{top:300vh;}#b4{top:400vh;}#b5{top:500vh;}
#b6{top:600vh;}#b7{top:700vh;}#b8{top:800vh;}#b9{top:900vh;}#b10{top:1000vh;}
</style>
</head>
<body>

<div id="scene">
    <div class="viewport">
        <div class="bg" id="movingBg"></div>
        <div id="frameContainer"></div>
    </div>
    <div class="text-block" id="b1"><h2>Block 1</h2><p>Text 1</p></div>
    <div class="text-block" id="b2"><h2>Block 2</h2><p>Text 2</p></div>
    <div class="text-block" id="b3"><h2>Block 3</h2><p>Text 3</p></div>
    <div class="text-block" id="b4"><h2>Block 4</h2><p>Text 4</p></div>
    <div class="text-block" id="b5"><h2>Block 5</h2><p>Text 5</p></div>
    <div class="text-block" id="b6"><h2>Block 6</h2><p>Text 6</p></div>
    <div class="text-block" id="b7"><h2>Block 7</h2><p>Text 7</p></div>
    <div class="text-block" id="b8"><h2>Block 8</h2><p>Text 8</p></div>
    <div class="text-block" id="b9"><h2>Block 9</h2><p>Text 9</p></div>
    <div class="text-block" id="b10"><h2>Block 10</h2><p>Text 10</p></div>
</div>

<script>
// الفريمات
const totalFrames = 345;
const container = document.getElementById("frameContainer");

for(let i = 1; i <= totalFrames; i++) {
    let div = document.createElement("div");
    div.className = "frame";
    let img = document.createElement("img");
    let num = String(i).padStart(4, '0');
    img.src = `NEW VERSION/${num}.webp`;
    div.appendChild(img);
    if(i === 1) div.classList.add("active");
    container.appendChild(div);
}

const frames = document.querySelectorAll(".frame");
let obj = { frame: 0 };

gsap.to(obj, {
    frame: totalFrames - 1,
    snap: "frame",
    ease: "none",
    scrollTrigger: {
        trigger: "#scene",
        start: "top top",
        end: "+=1000%",
        scrub: 1,
        pin: ".viewport"
    },
    onUpdate: () => {
        frames.forEach(f => f.classList.remove("active"));
        frames[Math.floor(obj.frame)].classList.add("active");
    }
});

// ========== حركة الخلفية (أكثر - 200px) ==========
const bg = document.getElementById('movingBg');
let maxMove = 200; // حركة أكثر (200px بدلاً من 80px)

function updateBackground() {
    const scrollY = window.scrollY;
    const maxScroll = document.body.scrollHeight - window.innerHeight;
    const progress = Math.min(1, Math.max(0, scrollY / maxScroll));
    const moveY = maxMove * progress;
    bg.style.transform = `translateY(-${moveY}px)`;
}

window.addEventListener('scroll', updateBackground);
window.addEventListener('resize', () => {
    updateBackground();
    ScrollTrigger.refresh();
});
updateBackground();

// حركة البلوكات
const blocks = document.querySelectorAll('.text-block');
blocks.forEach(block => {
    gsap.to(block, {
        scrollTrigger: {
            trigger: block,
            start: "top bottom",
            end: "top top",
            scrub: 1
        },
        y: -window.innerHeight * 0.5,
        opacity: 1,
        ease: "none"
    });
    gsap.set(block, { opacity: 0, y: 50 });
});
</script>

</body>
</html>
