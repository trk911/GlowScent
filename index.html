<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Test Frames Only (No BG Movement)</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<style>
*{margin:0;padding:0;}
body{background:#000;}
#scene{position:relative;height:1000vh;}
.viewport{position:sticky;top:0;height:100vh;overflow:hidden;}
.bg{position:absolute;top:0;left:0;width:100%;height:100%;background:url('background.PNG') center/cover no-repeat;z-index:0;}
.frame{position:absolute;width:100%;height:100%;top:0;left:0;display:none;z-index:1;}
.frame.active{display:block;}
.frame img{width:100%;height:100%;object-fit:contain;}
</style>
</head>
<body>
<div id="scene">
  <div class="viewport">
    <div class="bg"></div>
    <div id="container"></div>
  </div>
</div>

<script>
// الفريمات فقط - بدون أي حركة للخلفية
const totalFrames = 345;
const container = document.getElementById("container");

for(let i=1;i<=totalFrames;i++){
    let img=document.createElement("img");
    let num = String(i).padStart(4,'0');
    img.src=`NEW VERSION/${num}.webp`;
    img.className="frame";
    if(i===1) img.classList.add("active");
    container.appendChild(img);
}

const frames = document.querySelectorAll(".frame");
let obj = {frame:0};

gsap.to(obj,{
    frame: totalFrames-1,
    snap:"frame",
    ease:"none",
    scrollTrigger:{
        trigger:"#scene",
        start:"top top",
        end:"+=1000%",
        scrub:1,
        pin:".viewport"
    },
    onUpdate:()=>{
        frames.forEach(f=>f.classList.remove("active"));
        frames[Math.floor(obj.frame)].classList.add("active");
    }
});

// الخلفية ثابتة تماماً - لا حركة
console.log("خلفية ثابتة - اختبار الفريمات فقط");
</script>
</body>
</html>
